<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Liber</title>
<meta name="theme-color" content="#000000" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- LIBRARY VIEW -->
<section id="view-library" class="view active">

  <header class="topbar">
    <h1 class="brand">Liber</h1>

    <button id="btn-add" class="icon-btn" aria-label="Add book" title="Add book">
      <svg viewBox="0 0 24 24">
        <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/>
      </svg>
    </button>
  </header>

  <input
    id="file-input"
    type="file"
    accept=".epub,.pdf,application/epub+zip,application/pdf"
    multiple
    hidden
  />

  <!-- HOME -->
  <main id="home-content" class="library-content">

    <section class="book-section" id="continue-section">
      <h2>Continue Reading</h2>

      <div id="continue-shelf" class="home-shelf"></div>

      <p id="continue-empty" class="section-empty">
        Nothing here yet.
      </p>
    </section>

    <section class="book-section" id="tbr-section">
      <h2>TBR</h2>

      <div id="tbr-shelf" class="home-shelf"></div>

      <p id="tbr-empty" class="section-empty">
        Nothing here yet.
      </p>
    </section>

  </main>


  <!-- ALL BOOKS LIBRARY -->
  <main id="all-library" class="library-content" hidden>

    <h2 class="library-heading">Bookshelf</h2>

    <div id="library-bookshelf" class="bookshelf"></div>

    <p id="library-empty" class="section-empty">
      Your library is empty.
    </p>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button
      id="nav-home"
      class="bottom-nav-btn active"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3L3 10.2V21H9V14H15V21H21V10.2L12 3Z"/>
      </svg>
      <span>Home</span>
    </button>

    <button
      id="nav-library"
      class="bottom-nav-btn"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4H7V20H4V4ZM9 4H12V20H9V4ZM14 4H20V20H14V4ZM15 6V18H18V6H15Z"/>
      </svg>
      <span>Bookshelf</span>
    </button>

  </nav>


  <!-- BOOK SETTINGS MODAL -->
  <div
    id="book-settings"
    class="modal-backdrop"
    hidden
  >

    <div class="book-settings-modal">

      <div class="modal-header">

        <h2>Book Settings</h2>

        <button
          id="settings-close"
          class="icon-btn"
          aria-label="Close"
        >
          <svg viewBox="0 0 24 24">
           <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 6.41Z"/>
          </svg>
        </button>

      </div>


      <!-- COVER -->

      <div class="settings-cover-wrap">

        <div
          id="settings-cover"
          class="settings-cover"
        ></div>

        <button
          id="change-cover"
          class="secondary-btn"
        >
          Change Cover
        </button>

        <input
          id="cover-input"
          type="file"
          accept="image/*"
          hidden
        />

      </div>


      <!-- TITLE -->

      <label class="settings-field">

        <span>Title</span>

        <input
          id="settings-title"
          type="text"
        />

      </label>


      <!-- AUTHOR -->

      <label class="settings-field">

        <span>Author</span>

        <input
          id="settings-author"
          type="text"
        />

      </label>


      <!-- STATUS -->

      <div class="status-group">

        <span class="settings-label">
          Status
        </span>

        <label class="status-option">
          <input
            type="radio"
            name="book-status"
            value="reading"
          />
          <span>Continue Reading</span>
        </label>

        <label class="status-option">
          <input
            type="radio"
            name="book-status"
            value="tbr"
          />
          <span>TBR</span>
        </label>

        <label class="status-option">
          <input
            type="radio"
            name="book-status"
            value="finished"
          />
          <span>Finished</span>
        </label>

        <label class="status-option">
          <input
            type="radio"
            name="book-status"
            value="dropped"
          />
          <span>Dropped</span>
        </label>

      </div>


      <!-- SAVE -->

      <button
        id="settings-save"
        class="primary-btn"
      >
        Save
      </button>


      <!-- DELETE -->

      <button
        id="settings-delete"
        class="danger-btn"
      >
        Remove from Library
      </button>

    </div>

  </div>

</section>

<!-- READER VIEW -->
<section id="view-reader" class="view">
  <header class="topbar reader-bar">
    <button id="btn-back" class="icon-btn" aria-label="Back to library">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z"/></svg>
    </button>
    <span id="reader-title" class="reader-title"></span>
    <button id="btn-theme" class="icon-btn" aria-label="Toggle light/dark reading theme" title="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18V4c4.42 0 8 3.58 8 8s-3.58 8-8 8z"/></svg>
    </button>
    <button id="btn-toc" class="icon-btn" aria-label="Contents">
      <svg viewBox="0 0 24 24"><path d="M3 5H21V7H3V5M3 11H21V13H3V11M3 17H21V19H3V17Z"/></svg>
    </button>
  </header>

  <div id="epub-viewer" class="reader-surface"></div>
  <div id="pdf-viewer" class="reader-surface pdf-scroll" hidden></div>

<nav class="reader-nav">
  <span id="reader-progress" class="muted small"></span>
</nav>

  <aside id="toc-panel" class="toc-panel" hidden>
    <div class="toc-header">
      <span>Contents</span>
      <button id="btn-toc-close" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"/></svg>
      </button>
    </div>
    <ul id="toc-list"></ul>
  </aside>
</section>

<div id="toast" class="toast" hidden></div>

<!-- Local, vendored libraries (populated by scripts/copy-libs.js) -->
<script src="lib/jszip.min.js"></script>
<script src="lib/epub.min.js"></script>

<!-- pdfjs-dist ships as an ES module only, so it's loaded via dynamic import
     rather than a classic global script. Anything that needs pdfjsLib should
     `await window.LiberPdfjsReady` first. -->
<script type="module">
  window.LiberPdfjsReady = import("./lib/pdf.min.js")
    .then((mod) => {
      window.pdfjsLib = mod;
      if (mod.GlobalWorkerOptions) {
        mod.GlobalWorkerOptions.workerSrc = "lib/pdf.worker.min.js";
      }
      return mod;
    })
    .catch((err) => {
      console.error("Liber: failed to load pdf.js", err);
    });
</script>

<script src="js/db.js"></script>
<script src="js/reader-epub.js"></script>
<script src="js/reader-pdf.js"></script>
<script src="js/app.js"></script>
</body>
</html>
